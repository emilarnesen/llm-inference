; llama-server router presets.
; Each [section] is a model the API can ask for by name ("model": "<section name>").
; Keys are llama-server flags without the leading dashes. Docs:
; https://github.com/ggml-org/llama.cpp/blob/master/tools/server/README.md#model-presets
;
; Router-level settings (host, port, API key) live in the launchd plist, not here.
version = 1

; Defaults for every model.
[*]
; TOTAL context in tokens, split evenly across the slots below:
; 65536 / 2 slots = 32k tokens per request. Bigger = more GPU memory for the KV cache.
c = 65536
; parallel requests per model (slots)
np = 2
; hide cache entries that a preset below already covers
dedup-cache-models = true

; Smoke-test model: small and fast, not for real agent work.
[gemma-4-e2b]
hf-repo = ggml-org/gemma-4-E2B-it-GGUF:Q8_0
